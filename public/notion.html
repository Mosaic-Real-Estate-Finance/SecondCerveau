<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ouverture dans Notion…</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    background: #ffffff; color: rgb(2 3 66 / 0.62);
  }
  @media (prefers-color-scheme: dark) { body { background: #0d0d14; color: rgb(236 236 246 / 0.6); } }
</style>
</head>
<body>
<p>Ouverture dans Notion…</p>
<script>
// A notification that leads to a Notion page lands here (public/push-sw.js),
// so that the page opens in the Notion app rather than in the browser the
// installed app would show it in. iOS answers to Notion's own scheme;
// Android to an intent naming the app, with the web address as its fallback.
// If nothing has taken the link a moment later — Notion is not installed —
// the web address opens instead. Once Notion has the page, this window goes
// back to the app's home, which is what is found on coming back.
(function () {
  var raw = new URLSearchParams(location.search).get("u") || "";
  var page;
  try { page = new URL(raw); } catch (e) { page = null; }
  var notion = page && page.protocol === "https:" && /(^|\.)notion\.(so|com|site)$/.test(page.hostname);
  if (!notion) { location.replace("/"); return; }

  var rest = page.host + page.pathname + page.search + page.hash;
  var android = /Android/i.test(navigator.userAgent);
  var left = false;
  var home = function () { if (!left) { left = true; location.replace("/"); } };
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") setTimeout(home, 300);
  });

  if (android) {
    location.href = "intent://" + rest + "#Intent;scheme=https;package=notion.id;S.browser_fallback_url=" +
      encodeURIComponent(page.href) + ";end";
  } else {
    location.href = "notion://" + rest;
  }
  setTimeout(function () {
    if (document.visibilityState === "visible" && !left) { left = true; location.replace(page.href); }
  }, 1500);
})();
</script>
</body>
</html>
